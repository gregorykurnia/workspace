<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workbase">
<title>Workspace</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div>
    <div class="auth-title">Workbase</div>
    <div class="auth-sub">Sign in to your workspace</div>
    <div class="auth-err" id="auth-err"></div>
    <div class="auth-ok" id="auth-ok"></div>
    <div class="fr"><label>Email</label><input type="email" id="auth-email" placeholder="name@company.com" autocomplete="email"></div>
    <div class="fr"><label>Password</label><input type="password" id="auth-pw" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password"></div>
    <button class="btn pr" id="auth-btn" style="width:100%;justify-content:center;margin-top:4px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Sign in</button>
    <button id="auth-forgot">Forgot password?</button>
  </div>
</div>
<div id="sidebar">
  <div class="sb-head">
    <div class="sb-logo"><div class="sb-logo-icon">&#8862;</div>Workbase</div>
    <button id="sb-close" title="Collapse sidebar" aria-label="Collapse sidebar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </div>
  <div class="sb-nav">
    <div class="sb-nav-item active" id="nav-home"><span class="sni">&#8962;</span>Home</div>
    <div class="sb-nav-item" id="nav-search"><span class="sni">&#128269;</span>Search</div>
    <div class="sb-nav-item is-placeholder" aria-hidden="true"><span class="sni">&#128336;</span>Recent</div>
    <div class="sb-nav-item is-placeholder" aria-hidden="true"><span class="sni">&#9734;</span>Starred</div>
  </div>
  <div class="sync-row" role="status"><div class="sync-dot" id="sdot"></div><span class="sync-lbl" id="slbl">Connecting…</span></div>
  <div class="sb-lbl-row">
    <span class="sb-lbl">Workspaces</span>
    <button class="sb-lbl-add" id="btn-new-folder" title="New folder">&#65291;</button>
  </div>
  <div class="sb-scroll" id="tree"></div>
  <div class="sb-foot">
    <div class="sb-nav-item is-placeholder" aria-hidden="true"><span class="sni">&#9881;</span>Settings</div>
    <div class="sb-nav-item" id="sb-trash-btn"><span class="sni">&#128465;</span>Trash</div>
    <div class="sb-user" id="sb-user-btn" style="cursor:pointer">
      <div class="sb-avatar" id="sb-av">GK</div>
      <div style="flex:1;min-width:0"><div class="sb-user-name" id="sb-uname">Gregory K.</div><div class="sb-user-role" id="sb-urole">Professional</div></div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
  </div>
</div>
<div id="sb-scrim" class="hidden" aria-hidden="true"></div>
<div id="main">
  <div id="topbar">
    <div style="display:flex;align-items:center;gap:8px">
      <button id="sb-toggle" title="Toggle sidebar" aria-label="Toggle sidebar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="tb-divider"></div>
      <div id="bc"></div>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <div id="ta"></div>
      <div class="tb-date-chip" id="tb-date"></div>
      <button class="tb-icon-btn is-placeholder" aria-hidden="true" tabindex="-1" title="Notifications">&#128276;</button>
      <button class="tb-icon-btn is-placeholder" aria-hidden="true" tabindex="-1" title="Settings">&#9881;&#65039;</button>
    </div>
  </div>
  <div id="ca"><div class="loading"><div class="spinner"></div><span>Connecting to cloud...</span></div></div>
</div>
<div id="MR"></div><div id="CR"></div><div id="pdf-print"></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script src="js/rbac.js"></script>
<script src="js/pwa.js"></script>
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script type="module" src="js/tiptap.js"></script>
</body>
</html>
