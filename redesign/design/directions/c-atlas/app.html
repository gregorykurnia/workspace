<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFBFA">
<title>Atlas — Direction C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* ===== Tokens ===== */
:root{
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --bg:#FBFBFA; --surface:#FFFFFF; --sunken:#F3F3F0; --hover:#F1F1ED;
  --ink:#121614; --ink-2:#434946; --ink-3:#656B67; --ink-4:#A3A8A4;
  --line:#EBEBE6; --line-2:#DCDCD5;
  --accent:#0A7D61; --accent-hover:#08684F; --accent-ink:#065C47; --accent-bright:#16B88A;
  --accent-tint:#E9F6F1; --accent-tint-2:#D3EEE4;
  --danger:#B8322A; --danger-tint:#FDEFEC; --warn:#8F5600; --warn-tint:#FFF5E3;
  --flag:#C2510C;
  --r-sm:6px; --r:8px; --r-lg:12px; --r-xl:16px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --t-xs:12px; --t-sm:13px; --t-md:14px; --t-base:15px; --t-lg:17px; --t-xl:20px; --t-2xl:28px; --t-3xl:40px;
  --ease:cubic-bezier(.2,.7,.2,1); --dur:180ms;
  --shadow-pop:0 1px 2px rgba(18,22,20,.04),0 16px 40px -12px rgba(18,22,20,.16);
  --rail-w:64px; --col-w:288px; --spine-w:52px; --tab-h:64px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--t-base);line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
h1,h2,h3,p{margin:0}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono)}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.phone-only{display:none}
.muted{color:var(--ink-3)}

/* ===== App frame ===== */
.app{display:grid;grid-template-columns:var(--rail-w) 1fr;height:100vh;height:100dvh}
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;background:var(--surface);border-right:1px solid var(--line);z-index:6}
.brand{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;margin-bottom:12px}
.brand svg{width:26px;height:26px}
.rail-btn{position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--ink-3);text-decoration:none;transition:background var(--dur),color var(--dur)}
.rail-btn:hover{background:var(--hover);color:var(--ink)}
.rail-btn.is-active{background:var(--accent-tint);color:var(--accent-ink)}
.rail-btn .ic{width:20px;height:20px}
.rail-spacer{flex:1}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;font:500 12px/1 var(--font);padding:7px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:40}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#D9F2E8,#CBE6F4);color:var(--accent-ink);font:600 13px/1 var(--font);display:grid;place-items:center;letter-spacing:.02em}
.avatar.lg{width:44px;height:44px;font-size:15px}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}

/* ===== Top bar ===== */
.topbar{flex:none;height:60px;display:flex;align-items:center;gap:16px;padding:0 20px 0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;flex:1;font-size:var(--t-md);white-space:nowrap;overflow:hidden}
.crumb{color:var(--ink-3);text-decoration:none;padding:6px 8px;border-radius:6px;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
a.crumb:hover{color:var(--ink);background:var(--hover)}
.crumb[aria-current]{color:var(--ink);font-weight:500}
.crumb-sep{color:var(--ink-4);flex:none}
.top-right{display:flex;align-items:center;gap:16px;flex:none}
.search-trigger{display:flex;align-items:center;gap:10px;height:38px;padding:0 8px 0 12px;width:300px;border:1px solid var(--line-2);border-radius:var(--r);color:var(--ink-3);font-size:var(--t-md);background:var(--bg);transition:border-color var(--dur)}
.search-trigger:hover{border-color:var(--ink-4)}
.search-trigger span{flex:1;text-align:left}
kbd{font:500 11px/1.4 var(--mono);padding:1px 6px;border:1px solid var(--line-2);border-radius:5px;background:#fff;color:var(--ink-3)}
.sync{display:inline-flex;align-items:center;gap:8px;font:500 12px/1 var(--mono);color:var(--ink-3);white-space:nowrap}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--accent-bright);box-shadow:0 0 0 3px var(--accent-tint)}
.sync.is-off{color:var(--warn)}
.sync.is-off .ic{width:15px;height:15px}
.offline-banner{flex:none;display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--warn-tint);color:var(--warn);font-size:var(--t-sm);border-bottom:1px solid #F3E2BF}
.offline-banner .ic{width:16px;height:16px}

/* ===== Columns browser ===== */
.browser{flex:1;display:flex;min-height:0;position:relative}
.cols{display:flex;flex:none;min-height:0;overflow-x:auto}
.col{width:var(--col-w);flex:none;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--bg)}
.col-head{display:flex;align-items:center;gap:10px;padding:16px 10px 8px 20px;min-height:60px}
.col-emoji{font-size:18px;line-height:1}
.col-title{flex:1;min-width:0;font-size:var(--t-base);font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-actions{display:flex;gap:2px}
.col-body{flex:1;overflow-y:auto;padding:2px 10px 20px;overscroll-behavior:contain}
.col-foot{padding:12px 20px 14px;font:400 12px/1.6 var(--mono);color:var(--ink-3);border-top:1px solid var(--line)}
.col.is-drop,.grp.is-drop{background:var(--accent-tint)}
.spine{width:var(--spine-w);flex:none;display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 0;border-right:1px solid var(--line);background:var(--bg);text-decoration:none;color:var(--ink-2);transition:background var(--dur)}
.spine:hover{background:var(--hover)}
.spine-emoji{font-size:18px;line-height:1}
.spine-emoji .ic{color:var(--ink-3)}
.spine-name{writing-mode:vertical-rl;transform:rotate(180deg);font-size:var(--t-sm);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:60vh}
.spine.is-drop{background:var(--accent-tint)}

.sec{display:flex;align-items:center;gap:8px;padding:20px 4px 6px 10px}
.sec:first-child{padding-top:8px}
.sec-label{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
.sec-count{font:400 11px/1 var(--mono);color:var(--ink-4)}
.sec .mini-btn{margin-left:auto}
.mini-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:6px;color:var(--ink-3);transition:background var(--dur),color var(--dur)}
.mini-btn:hover{background:var(--hover);color:var(--ink)}
.mini-btn .ic{width:16px;height:16px}

.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:6px 10px;border-radius:var(--r);color:var(--ink);text-decoration:none;position:relative;transition:background var(--dur)}
.row:hover{background:var(--hover)}
.row.is-path{background:var(--sunken)}
.row.is-path .row-title{font-weight:500}
.row.is-selected{background:var(--accent-tint)}
.row.is-selected .row-title{color:var(--accent-ink);font-weight:500}
.row.is-drop{background:var(--accent-tint);box-shadow:inset 0 0 0 1.5px var(--accent)}
.row.is-new{animation:flash 1.6s var(--ease)}
@keyframes flash{0%,30%{background:var(--accent-tint-2)}100%{background:transparent}}
.row-emoji{width:28px;text-align:center;font-size:17px;line-height:1;flex:none}
.row-ico{width:28px;height:28px;display:grid;place-items:center;color:var(--ink-3);flex:none}
.row-title{flex:1;min-width:0;font-size:var(--t-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-meta{font:400 12px/1 var(--mono);color:var(--ink-3);flex:none}
.row-chev{width:15px;height:15px;color:var(--ink-4)}
.row-flag{width:14px;height:14px;color:var(--flag)}
.row-lock{width:15px;height:15px;color:var(--ink-3)}
.row-thumb{width:28px;height:28px;border-radius:6px;background:var(--sunken) center/cover no-repeat;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.kind{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font:600 8.5px/1 var(--mono);letter-spacing:.02em;flex:none}
.k-pdf{background:#FDEDEB;color:#A8261D}.k-image{background:#EAF1FD;color:#1D57B8}.k-video{background:#F1EBFD;color:#5E35B8}
.k-sheet{background:#E5F4EB;color:#17683B}.k-slides{background:#FDEFE1;color:#9A4B08}.k-link{background:#E7F0FA;color:#1B5596}
.k-doc,.k-other{background:#EEF0F2;color:#45505C}
.kind.lg{width:96px;height:96px;border-radius:18px;font-size:18px}

.grp{margin:2px 0 6px;border-radius:var(--r);transition:background var(--dur)}
.grp-head{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 0 0 10px;color:var(--ink-2)}
.grp-head .ic{width:16px;height:16px;color:var(--ink-3)}
.grp-name{flex:1;min-width:0;font-size:var(--t-sm);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp-count{font:400 11px/1 var(--mono);color:var(--ink-4)}
.grp-items{margin-left:17px;padding-left:5px;border-left:1px solid var(--line-2)}
.grp-empty{font-size:var(--t-sm);color:var(--ink-3);padding:8px 10px 10px}
.col-note{font-size:var(--t-sm);color:var(--ink-3);padding:4px 10px 6px}

.col-empty,.lock{padding:36px 14px;text-align:left}
.col-empty .t,.lock .t{font-size:var(--t-lg);font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.col-empty .s,.lock .s{font-size:var(--t-sm);color:var(--ink-3);margin-bottom:20px}
.col-empty .btn{width:100%;justify-content:flex-start;margin-bottom:8px}
.lock-ic{width:44px;height:44px;border-radius:12px;background:var(--sunken);display:grid;place-items:center;margin-bottom:16px;color:var(--ink-2)}
.lock form{display:grid;gap:10px}
.lock .hint{font-size:11px;color:var(--ink-3);margin-top:14px}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.drop-overlay{position:absolute;inset:12px;border:1.5px dashed var(--accent);border-radius:var(--r-lg);background:rgba(233,246,241,.86);display:none;place-items:center;z-index:8;pointer-events:none}
.drop-overlay div{text-align:center;color:var(--accent-ink);font-weight:500}
.drop-overlay .ic{width:28px;height:28px;margin-bottom:8px}
.browser.is-filedrop .drop-overlay{display:grid}

/* ===== Pane ===== */
.pane{flex:1;min-width:0;overflow-y:auto;background:var(--surface)}
.pane-inner{max-width:780px;margin:0 auto;padding:48px 56px 96px}
.eyebrow{font:500 11px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin-bottom:12px}
.pane-title{font-size:var(--t-3xl);line-height:1.08;font-weight:600;letter-spacing:-.035em;margin-bottom:16px;text-wrap:balance}
.pane-title.sm{font-size:32px}
.lede{font-size:var(--t-lg);color:var(--ink-2);margin-bottom:8px}
.pane-bar{display:flex;align-items:center;gap:8px;margin-bottom:40px}
.pane-bar .grow{flex:1}
.pane-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-bottom:24px;margin-bottom:28px;border-bottom:1px solid var(--line);font-size:var(--t-sm);color:var(--ink-3)}
.pane-meta .ic{width:15px;height:15px}
.meta-bit{display:inline-flex;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:999px;background:var(--sunken);color:var(--ink-2);font-size:12px;font-weight:500}
.chip button{width:20px;height:20px;display:grid;place-items:center;border-radius:50%;color:var(--ink-3);margin-right:-6px}
.chip button:hover{background:var(--line-2);color:var(--ink)}
.chip button .ic{width:12px;height:12px}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:var(--t-sm);color:var(--ink-2);padding:6px 10px;border-radius:999px;background:var(--sunken)}
.badge .ic{width:15px;height:15px}
.hero-emoji{display:block;font-size:44px;line-height:1;margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin:28px 0 32px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{padding:16px 0 18px;border-left:1px solid var(--line);padding-left:18px}
.stats div:first-child{border-left:0;padding-left:0}
.stats dt{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin-bottom:10px}
.stats dd{margin:0;font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1}
.stats dd span{display:block;font:400 12px/1 var(--mono);color:var(--ink-3);margin-top:8px;letter-spacing:0}
.pane-cta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:48px}
.h-sec{display:flex;align-items:baseline;gap:10px;font-size:var(--t-md);font-weight:600;margin-bottom:6px}
.h-sec .count{font:400 12px/1 var(--mono);color:var(--ink-3)}
.home-sec{margin-top:44px}
.drop-hint{display:flex;align-items:center;gap:12px;margin-top:48px;padding:18px 20px;border:1px dashed var(--line-2);border-radius:var(--r-lg);color:var(--ink-3);font-size:var(--t-sm)}
.empty-block{padding:36px 0;border-top:1px solid var(--line)}
.empty-block .t{font-size:var(--t-xl);font-weight:600;letter-spacing:-.02em;margin-bottom:6px}
.empty-block .s{color:var(--ink-3);max-width:46ch}

.lrows{border-top:1px solid var(--line)}
.lrow-wrap{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.lrow{flex:1;min-width:0;display:flex;align-items:center;gap:14px;min-height:60px;padding:10px 6px;text-decoration:none;color:var(--ink);border-radius:var(--r);transition:background var(--dur)}
.lrow:hover{background:var(--bg)}
.lrow-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.lrow-title{font-size:var(--t-base);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow-path{font:400 12px/1.3 var(--mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow-when{font:400 12px/1 var(--mono);color:var(--ink-3);flex:none}
.lrows-empty{padding:20px 6px;color:var(--ink-3);font-size:var(--t-sm);border-bottom:1px solid var(--line)}

.cont-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:32px}
.cont{display:flex;flex-direction:column;gap:6px;padding:18px 0 20px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);transition:border-color var(--dur)}
.cont:hover{border-top-color:var(--accent)}
.cont:hover .cont-title{color:var(--accent-ink)}
.cont-kind{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
.cont-title{font-size:var(--t-lg);font-weight:600;letter-spacing:-.015em}
.cont-path{font-size:var(--t-sm);color:var(--ink-3)}

.file-stage{display:grid;place-items:center;min-height:300px;margin:8px 0 28px;border-radius:var(--r-lg);background:var(--bg);border:1px solid var(--line);overflow:hidden}
.file-stage img{display:block;max-width:100%;max-height:420px}
button.file-stage{width:100%;cursor:zoom-in;padding:0}
.file-stage .stage-note{font-size:var(--t-sm);color:var(--ink-3);margin-top:14px;text-align:center}
.facts{display:grid;grid-template-columns:120px 1fr;gap:14px 20px;margin:0 0 32px;font-size:var(--t-md)}
.facts dt{font:500 11px/1.9 var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
.facts dd{margin:0;color:var(--ink-2)}

/* ===== Buttons & fields ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line-2);background:#fff;font-size:var(--t-md);font-weight:500;color:var(--ink);white-space:nowrap;transition:background var(--dur),border-color var(--dur),color var(--dur)}
.btn:hover{background:var(--hover)}
.btn .ic{width:16px;height:16px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger:hover{background:#9E2A23}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{min-height:34px;padding:0 12px;font-size:var(--t-sm)}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:var(--r);color:var(--ink-2);flex:none;transition:background var(--dur),color var(--dur)}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn[aria-pressed="true"]{color:var(--flag)}
.link-btn{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(10,125,97,.35);min-height:32px}
.link-btn:hover{text-decoration-color:var(--accent)}
.link-btn .ic{width:15px;height:15px}
.field{display:grid;gap:6px;margin:0 0 18px;border:0;padding:0;min-width:0}
.field>label,.field>legend{font-size:var(--t-sm);font-weight:500;color:var(--ink-2);padding:0;margin-bottom:6px}
.field>legend{margin-bottom:8px}
.opt{font-weight:400;color:var(--ink-3)}
.input{width:100%;min-height:44px;border:1px solid var(--line-2);border-radius:var(--r);padding:10px 12px;background:#fff;font-size:var(--t-base);transition:border-color var(--dur),box-shadow var(--dur)}
textarea.input{resize:vertical;line-height:1.5}
.input::placeholder{color:#8C918D}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint-2)}
.field.has-error .input{border-color:var(--danger)}
.field.has-error .input:focus{box-shadow:0 0 0 3px var(--danger-tint)}
.err{display:flex;align-items:center;gap:6px;color:var(--danger);font-size:var(--t-sm)}
.err .ic{width:15px;height:15px}
.hint-line{font-size:12px;color:var(--ink-3)}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--sunken);gap:2px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;padding:8px 14px;border-radius:7px;font-size:var(--t-sm);font-weight:500;color:var(--ink-3);cursor:pointer}
.seg input:checked+span{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kind-tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:12px;min-height:72px;border:1px solid var(--line-2);border-radius:var(--r);cursor:pointer;font-size:var(--t-sm);font-weight:500;color:var(--ink-2);transition:border-color var(--dur),background var(--dur)}
.kind-tile input{position:absolute;opacity:0}
.kind-tile:hover{background:var(--bg)}

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TODAY = '2026-10-13';
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDate = s => { const d = parseD(s); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const fmtShort = s => { const d = parseD(s); return d.getFullYear() === 2026 ? `${d.getDate()} ${MONTHS[d.getMonth()]}` : `${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const daysAgo = s => Math.round((parseD(TODAY) - parseD(s)) / 864e5);
const rel = s => { const n = daysAgo(s); if (n <= 0) return 'Today'; if (n === 1) return 'Yesterday'; if (n < 7) return `${n} days ago`; return fmtShort(s); };

    for (let i = 1; i < parts.length; i++) { if (parts[i] === 'item') { item = parts[i + 1] || null; break; } raw.push(parts[i]); }

    const empty = S.emptyDemo && last;
    body = locked ? lockHTML(a) : empty ? areaEmpty(a) : areaBody(a, i, path, it);
    const k = empty ? { m: 0, f: 0, s: 0 } : counts(a.id);
    foot = k ? `${plural(k.m, 'MoM')} · ${plural(k.f, 'file')} · ${plural(k.s, 'sub-area')}<br>Since ${fmtShort(a.created)} · ${age(a.created)}` : 'Contents hidden while restricted';
  }
  return `<section class="col ${last ? 'is-last' : ''}" data-col="${i}" data-area="${aid || 'root'}" ${a && !isLocked(a) ? `data-drop-area="${a.id}"` : ''} aria-label="${esc(a ? a.name : 'All areas')}">
    <header class="col-head">${head}</header>

}

function areaRow(c, hrefPath, state) {

function rootBody(tops, path, it) {

  const itState = x => it && it.id === x.id ? 'is-selected' : '';
  const grpBlock = (g, items) => `<div class="grp" data-drop-area="${a.id}" data-drop-grp="${g.id}" data-grp-kind="${g.kind}">
      <div class="grp-head">${icon('i-layers')}<span class="grp-name">${esc(g.name)}</span><span class="grp-count">${items.length}</span>

      ${g.map(x => grpBlock(x, list.filter(y => y.grouping === x.id))).join('')}

/* ---------- Overlay stack ---------- */
const stack = [];
function pushOverlay(el, onClose) {
  el.classList.add('ov');
  document.body.appendChild(el);
  stack.push({ el, onClose, ret: document.activeElement });
  requestAnimationFrame(() => el.classList.add('is-open'));
}
function closeOverlay(el) {
  const i = stack.findIndex(o => o.el === el); if (i < 0) return;
  const [o] = stack.splice(i, 1); o.el.remove(); if (o.onClose) o.onClose();
  if (o.ret && document.contains(o.ret)) o.ret.focus({ preventScroll: true });
}
const closeTop = () => { if (stack.length) closeOverlay(stack[stack.length - 1].el); };
const focusables = r => $$('a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select,textarea,[tabindex]:not([tabindex="-1"])', r).filter(x => x.offsetParent !== null);

function toast(msg, { ic = 'i-check', action } = {}) {
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `${icon(ic)}<span>${esc(msg)}</span>${action ? `<button class="toast-btn">${esc(action.label)}</button>` : ''}`;
  $('#toasts').appendChild(t);
  if (action) t.querySelector('button').addEventListener('click', () => { action.fn(); t.remove(); });
  setTimeout(() => { t.classList.add('is-out'); setTimeout(() => t.remove(), 240); }, action ? 6000 : 3200);
}
const adminOnly = what => { toast(`Only admins can ${what}.`, { ic: 'i-lock' }); };

let dlgN = 0;
function openDialog({ title, body, actions, onClose, wide }) {
  const id = 'dlg' + (++dlgN);
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  scrim.innerHTML = `<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="${id}" ${wide ? 'style="width:min(600px,100%)"' : ''}>
    <header class="dlg-head"><h2 id="${id}">${title}</h2><button class="icon-btn" data-close aria-label="Close">${icon('i-x')}</button></header>
    <div class="dlg-body">${body}</div><footer class="dlg-foot">${actions}</footer></div>`;
  scrim.addEventListener('mousedown', e => { if (e.target === scrim) closeOverlay(scrim); });
  pushOverlay(scrim, onClose);
  const dlg = scrim.firstElementChild;
  const first = $('input:not([type=radio]):not([type=hidden]),textarea', dlg) || $('.dlg-foot .btn-primary,.dlg-foot .btn-danger', dlg) || $('[data-close]', dlg);
  setTimeout(() => first && first.focus(), 30);
  return dlg;
}
const closeDlg = dlg => closeOverlay(dlg.closest('.ov'));
function fieldError(input, msg) {
  const f = input.closest('.field'); f.classList.add('has-error');
  let e = f.querySelector('.err'); if (!e) { e = document.createElement('p'); e.className = 'err'; e.setAttribute('role', 'alert'); f.appendChild(e); }
  e.innerHTML = `${icon('i-alert')}${esc(msg)}`; input.setAttribute('aria-invalid', 'true');
  input.addEventListener('input', () => { f.classList.remove('has-error'); e.remove(); input.removeAttribute('aria-invalid'); }, { once: true });
}

function popover(anchor, html, { cls = '', label = 'Menu', role = 'menu' } = {}) {
  const scrim = document.createElement('div'); scrim.className = 'menu-scrim';
  scrim.innerHTML = `<div class="pop ${cls}" role="${role}" aria-label="${esc(label)}">${html}</div>`;
  scrim.addEventListener('mousedown', e => { if (e.target === scrim) closeOverlay(scrim); });
  pushOverlay(scrim);
  const pop = scrim.firstElementChild;
  if (innerWidth >= 768 && anchor) {
    const r = anchor.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
    let left = r.left; if (left + w > innerWidth - 12) left = Math.max(12, r.right - w);
    let top = r.bottom + 6; if (top + h > innerHeight - 12) top = Math.max(12, r.top - h - 6);
    pop.style.left = left + 'px'; pop.style.top = top + 'px';
  }
  return { scrim, pop, close: () => closeOverlay(scrim) };
}
function openMenu(anchor, items, title) {
  const html = (title ? `<p class="menu-title">${esc(title)}</p>` : '') + items.map((it, i) => it === '-' ? '<hr>' :
    `<button role="menuitem" class="menu-item ${it.danger ? 'is-danger' : ''}" data-i="${i}">${icon(it.ic)}<span>${esc(it.label)}</span>${it.hint ? `<kbd>${it.hint}</kbd>` : ''}</button>`).join('');
  const p = popover(anchor, html, { label: title || 'Menu' });
  p.pop.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (!b) return; const it = items[+b.dataset.i]; p.close(); it.run(); });
  p.pop.addEventListener('keydown', e => {

/* ---------- Create menus ---------- */

function openNewSheet(anchor) {
  const r = S.route, a = r.view === 'browse' && r.path.length ? area(r.path[r.path.length - 1]) : null;

/* ---------- C6: upload ---------- */
let pendingPick = null;
const pickFile = cb => { pendingPick = cb; $('#fileInput').click(); };
function openUpload({ areaId, grp = null, file = null }) {
  const a = area(areaId); const fgs = (a.groupings || []).filter(g => g.kind === 'file');
  let timer = null, done = false, fileObj = null;
  const dlg = openDialog({
    title: `Upload to ${esc(a.name)}`,
    onClose: () => clearInterval(timer),
    body: `<div class="dropzone" data-role="zone"><div class="dz-ic">${icon('i-upload')}</div><p class="dz-t">Drop a file here</p>
        <p class="dz-s">or <button type="button" class="link-btn" data-role="choose">choose from your device</button></p>
        <p class="dz-hint">Images, videos, PDFs and any other file. PDFs over 10 MB can’t be stored — save those as a link.</p></div>
      <div class="upfile" data-role="file" hidden><span data-role="lead"></span><div class="upfile-main">
        <div class="upfile-row"><span class="upfile-name" data-role="fname"></span><span class="mono upfile-pct" data-role="pct">0%</span></div>
        <div class="progress" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-role="bar"><i></i></div>
        <span class="mono upfile-size" data-role="fsize"></span></div></div>
      <div class="notice is-danger" data-role="error" role="alert" hidden></div>
      <div class="field"><label for="upName">Name <span class="opt">— optional</span></label><input id="upName" class="input" data-role="name" placeholder="Uses the file’s own name"></div>
      <div class="field"><label for="upNote">Note <span class="opt">— optional</span></label><textarea id="upNote" class="input" rows="2" data-role="note" placeholder="What is it, or why does it matter?"></textarea></div>
      ${fgs.length ? `<div class="field"><label for="upGrp">Grouping</label><select id="upGrp" class="input" data-role="grp"><option value="">None — sits in ${esc(a.name)}</option>${fgs.map(g => `<option value="${g.id}" ${g.id === grp ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select></div>` : ''}`,
    actions: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-role="add" disabled>Add file</button>`
  });
  const q = r => dlg.querySelector(`[data-role="${r}"]`);
  const zone = q('zone');
  q('choose').addEventListener('click', () => pickFile(start));
  zone.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); zone.classList.add('is-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('is-over'));
  zone.addEventListener('drop', e => { e.preventDefault(); e.stopPropagation(); zone.classList.remove('is-over'); if (e.dataTransfer.files[0]) start(e.dataTransfer.files[0]); });
  function setP(p) { const v = Math.round(p); q('pct').textContent = v + '%'; q('bar').firstElementChild.style.width = v + '%'; q('bar').setAttribute('aria-valuenow', v); }
  function start(f) {
    clearInterval(timer); done = false; fileObj = f;
    zone.hidden = true; q('file').hidden = false; q('file').classList.remove('is-failed'); q('error').hidden = true;
    q('fname').textContent = f.name; q('fsize').textContent = fmtSize(f.size); q('lead').innerHTML = kindTile(kindOf(f.name));
    const add = q('add'); add.disabled = true; add.textContent = 'Uploading…';
    const tooBig = /\.pdf$/i.test(f.name) && f.size > 10 * 1048576;
    let p = 0; setP(0);
    timer = setInterval(() => {
      p = Math.min(100, p + 5 + Math.random() * 11);
      if (tooBig && p >= 34) { clearInterval(timer); setP(34); fail(f); return; }
      setP(p);
      if (p >= 100) { clearInterval(timer); done = true; q('pct').textContent = 'Uploaded'; add.disabled = false; add.textContent = 'Add file'; }
    }, 170);
  }
  function fail(f) {
    q('file').classList.add('is-failed'); q('pct').textContent = 'Stopped';
    const e = q('error'); e.hidden = false;
    e.innerHTML = `${icon('i-alert')}<div><p class="notice-t">Too large for storage</p><p>PDFs over 10 MB can’t be uploaded on the current storage plan. Save it as a link to where it already lives instead.</p>
      <div class="notice-actions"><button class="btn btn-primary btn-sm" data-role="aslink">${icon('i-link')}Save as link instead</button><button class="btn btn-sm" data-role="again">Choose another file</button></div></div>`;
    q('add').textContent = 'Add file';
    q('aslink').addEventListener('click', () => { const nm = (q('name').value.trim() || f.name).replace(/\.[^.]+$/, ''); const note = q('note').value; closeDlg(dlg); openLink({ areaId, name: nm, kind: 'doc', note }); });
    q('again').addEventListener('click', () => pickFile(start));
    q('aslink').focus();
  }
  q('add').addEventListener('click', () => {
    if (!done) return;
    const k = kindOf(fileObj.name);
    const item = { id: uid('f'), name: q('name').value.trim() || fileObj.name, kind: k, size: fmtSize(fileObj.size), date: TODAY, area: areaId, grouping: (q('grp') && q('grp').value) || null, note: q('note').value.trim(), flagged: false };
    if (k === 'image') item.src = (typeof File !== 'undefined' && fileObj instanceof File) ? URL.createObjectURL(fileObj) : ART.shelf;
    S.files.push(item); S.flash = item.id; closeDlg(dlg); render();
    toast(`Added “${item.name}” to ${a.name}${item.grouping ? ' · ' + grpName(areaId, item.grouping) : ''}`);
  });
  if (file) start(file);
}

/* ---------- O5: move ---------- */
function moveItem(it, areaId, grp) {
  const prev = { area: it.area, grouping: it.grouping };
  it.area = areaId; it.grouping = grp || null; S.flash = it.id;
  const dest = area(areaId).name + (grp ? ' · ' + grpName(areaId, grp) : '');
  if (S.route.view === 'browse' && S.route.item === it.id) go(hashFor(S.route.path)); else render();
  toast(`Moved “${itemName(it)}” to ${dest}`, { ic: 'i-move', action: { label: 'Undo', fn: () => { it.area = prev.area; it.grouping = prev.grouping; render(); toast('Move undone'); } } });
}
function openMove(it) {
  const kind = isMom(it) ? 'mom' : 'file';
  const dests = [];
  flatAreas().forEach(({ a, depth }) => {
    dests.push({ area: a.id, grp: null, depth, label: a.name, emoji: a.emoji, locked: isLocked(a) });
    if (!isLocked(a)) (a.groupings || []).filter(g => g.kind === kind).forEach(g => dests.push({ area: a.id, grp: g.id, depth: depth + 1, label: g.name, isGrp: true }));
  });
  let sel = null;
  const dlg = openDialog({
    title: `Move “${esc(itemName(it))}”`,
    body: `<p class="move-current">${icon('i-columns')}<span>Currently in</span><b>${esc(itemLocation(it))}</b></p>
      <div class="search-field">${icon('i-search')}<input class="input" data-role="q" placeholder="Search areas and groupings" aria-label="Search destinations"></div>
      <div class="dest-list" role="listbox" aria-label="Destinations" data-role="list"></div>`,
    actions: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-role="go" disabled>Move here</button>`
  });
  const list = $('[data-role=list]', dlg), qi = $('[data-role=q]', dlg), btn = $('[data-role=go]', dlg);
  const isCur = d => d.area === it.area && (d.grp || null) === (it.grouping || null);
  let shown = [];
  const draw = () => {
    const q = qi.value.trim().toLowerCase();
    shown = q ? dests.filter(d => d.label.toLowerCase().includes(q)) : dests;
    if (sel && !shown.includes(sel)) { sel = null; }
    btn.disabled = !sel;
    list.innerHTML = shown.length ? shown.map((d, i) => `<button type="button" role="option" aria-selected="${d === sel}" class="dest ${d.isGrp ? 'is-grp' : ''} ${d === sel ? 'is-sel' : ''}" style="--d:${q ? 0 : d.depth}" data-k="${i}" ${isCur(d) || d.locked ? 'disabled' : ''}>
        ${d.isGrp ? icon('i-layers') : `<span aria-hidden="true">${d.emoji}</span>`}<span class="dest-name">${esc(d.label)}</span>
        ${q ? `<span class="dest-path mono">${esc(d.isGrp ? pathNames(d.area) : (area(d.area).parent ? pathNames(area(d.area).parent) : 'Top level'))}</span>` : ''}
        ${isCur(d) ? '<span class="tag-cur">Current</span>' : ''}${d.locked ? icon('i-lock') : ''}</button>`).join('')
      : `<div class="empty-mini"><b>No destination matches “${esc(qi.value)}”</b>Try another name, or create the area first.</div>`;
  };
  const confirm = () => { if (!sel) return; closeDlg(dlg); moveItem(it, sel.area, sel.grp); };
  list.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (!b) return; sel = shown[+b.dataset.k]; draw(); list.querySelector('.is-sel')?.focus(); });
  list.addEventListener('dblclick', e => { if (e.target.closest('[data-k]')) confirm(); });
  qi.addEventListener('input', draw);
  qi.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const ok = shown.filter(d => !isCur(d) && !d.locked); if (!sel && ok.length === 1) { sel = ok[0]; draw(); } else confirm(); } });
  list.addEventListener('keydown', e => { if (e.key === 'Enter' && sel) { e.preventDefault(); confirm(); } });
  btn.addEventListener('click', confirm);
  draw();
}

/* ---------- O8: delete ---------- */
function confirmDelete(it) {
  if (S.role !== 'admin') return adminOnly('delete');
  const dlg = openDialog({
    title: `Delete “${esc(itemName(it))}”?`,
    body: `<p class="dlg-text">It moves to <b>Deleted</b>, where anyone can restore it for 7 days. After that it’s removed for good.</p>`,
    actions: `<button class="btn" data-close>Cancel</button><button class="btn btn-danger" data-role="del">${icon('i-trash')}Delete</button>`
  });
  $('[data-role=del]', dlg).addEventListener('click', () => {
    const mom = isMom(it), arr = mom ? S.moms : S.files;
    arr.splice(arr.indexOf(it), 1);
    const d = { id: uid('d'), kind: mom ? 'mom' : 'file', name: itemName(it), from: itemLocation(it), deleted: TODAY, snap: mom ? { moms: [it] } : { files: [it] } };
    S.deleted.unshift(d); closeDlg(dlg);
    go(S.route.view === 'editor' ? hashFor(pathTo(it.area)) : hashFor(S.route.path || []));
    toast(`Deleted “${d.name}”`, { ic: 'i-trash', action: { label: 'Undo', fn: () => restore(d.id) } });
  });
}
function confirmDeleteArea(a) {
  if (S.role !== 'admin') return adminOnly('delete areas');
  const k = counts(a.id) || { m: 0, f: 0, s: 0 };
  const dlg = openDialog({
    title: `Delete ${a.emoji} ${esc(a.name)}?`,
    body: `<p class="dlg-text">${esc(a.name)} goes <b>with everything inside it</b>: ${plural(k.s, 'sub-area')}, ${plural(k.m, 'MoM')} and ${plural(k.f, 'file')}.</p><p class="dlg-text">You can restore it from Deleted for 7 days.</p>`,
    actions: `<button class="btn" data-close>Cancel</button><button class="btn btn-danger" data-role="del">${icon('i-trash')}Delete area and contents</button>`
  });
  $('[data-role=del]', dlg).addEventListener('click', () => {
    const ids = S.areas.filter(x => pathTo(x.id).includes(a.id)).map(x => x.id);
    const snap = { areas: S.areas.filter(x => ids.includes(x.id)), moms: S.moms.filter(m => ids.includes(m.area)), files: S.files.filter(f => ids.includes(f.area)) };
    S.areas = S.areas.filter(x => !ids.includes(x.id)); S.moms = S.moms.filter(m => !ids.includes(m.area)); S.files = S.files.filter(f => !ids.includes(f.area));
    const d = { id: uid('d'), kind: 'area', name: a.name, from: a.parent ? pathNames(a.parent) : 'Top level', deleted: TODAY, snap };
    S.deleted.unshift(d); closeDlg(dlg); go(hashFor(a.parent ? pathTo(a.parent) : []));
    toast(`Deleted ${a.name}`, { ic: 'i-trash', action: { label: 'Undo', fn: () => restore(d.id) } });
  });
}
function restore(id) {
  const d = S.deleted.find(x => x.id === id); if (!d) return;
  S.areas.push(...(d.snap.areas || [])); S.moms.push(...(d.snap.moms || [])); S.files.push(...(d.snap.files || []));
  S.deleted = S.deleted.filter(x => x !== d); render(); toast(`Restored “${d.name}”`, { ic: 'i-restore' });
}

function openPalette() {

  const scrim = document.createElement('div'); scrim.className = 'scrim palette-scrim';
  scrim.innerHTML = `<div class="palette" role="dialog" aria-modal="true" aria-label="Search and jump">
    <div class="pal-input">${icon('i-search')}<input type="text" placeholder="Search areas, minutes and files…" aria-label="Search" role="combobox" aria-expanded="true" aria-controls="palRes" autocomplete="off"><button class="icon-btn phone-only" data-close aria-label="Close">${icon('i-x')}</button></div>
    <div class="pal-results" id="palRes" role="listbox"></div>
    <div class="pal-foot desk-only"><span><kbd>↑</kbd> <kbd>↓</kbd> to move</span><span><kbd>↵</kbd> to open</span><span><kbd>esc</kbd> to close</span></div></div>`;
  scrim.addEventListener('mousedown', e => { if (e.target === scrim) closeOverlay(scrim); });
  pushOverlay(scrim);
  const input = $('input', scrim), res = $('#palRes', scrim);
  let rows = [], active = 0;
  const row = (href, lead, title, path) => `<a class="pal-row" role="option" href="${href}">${lead}<span class="pal-main"><span class="pal-title">${esc(title)}</span><span class="pal-path">${esc(path)}</span></span></a>`;
  const draw = () => {
    const q = input.value.trim().toLowerCase(); let html = '';
    const areas = flatAreas().filter(({ a }) => !q || a.name.toLowerCase().includes(q));
    if (!q) {
      const rec = S.recent.map(findItem).filter(itemOK).slice(0, 4);
      if (rec.length) html += `<p class="pal-group">Recent</p>` + rec.map(x => row(isMom(x) ? '#/mom/' + x.id : itemHash(x), itemLead(x), itemName(x), itemLocation(x))).join('');
      html += `<p class="pal-group">Jump to an area</p>` + areas.map(({ a, depth }) => row(hashFor(pathTo(a.id)), `<span class="row-emoji" style="margin-left:${depth * 16}px">${a.emoji}</span>`, a.name, a.parent ? pathNames(a.parent) : 'Top level')).join('');
    } else {
      const moms = S.moms.filter(m => itemOK(m) && (m.title.toLowerCase().includes(q) || m.body.replace(/<[^>]+>/g, ' ').slice(0, 300).toLowerCase().includes(q)));
      const files = S.files.filter(f => itemOK(f) && (f.name.toLowerCase().includes(q) || (f.note || '').toLowerCase().includes(q)));
      if (areas.length) html += `<p class="pal-group">Areas</p>` + areas.map(({ a }) => row(hashFor(pathTo(a.id)), `<span class="row-emoji">${a.emoji}</span>`, a.name, a.parent ? pathNames(a.parent) : 'Top level')).join('');
      if (moms.length) html += `<p class="pal-group">Minutes</p>` + moms.map(m => row(itemHash(m), itemLead(m), m.title, itemLocation(m) + ' · ' + fmtShort(m.date))).join('');
      if (files.length) html += `<p class="pal-group">Files</p>` + files.map(f => row(itemHash(f), itemLead(f), f.name, itemLocation(f))).join('');
      if (!html) html = `<div class="empty-mini"><b>Nothing matches “${esc(input.value)}”</b>Try a shorter word, or check the spelling. Restricted areas aren’t searched until unlocked.</div>`;
    }
    res.innerHTML = html; rows = $$('.pal-row', res); active = 0; mark();

    if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(0, active - 1); mark(); }
    if (e.key === 'Enter' && rows[active]) { e.preventDefault(); const h = rows[active].getAttribute('href'); closeOverlay(scrim); go(h); }
  });
  res.addEventListener('click', e => { const a = e.target.closest('.pal-row'); if (a) { e.preventDefault(); closeOverlay(scrim); go(a.getAttribute('href')); } });
  draw(); setTimeout(() => input.focus(), 20);
}

  const th = e.target.closest('th'); if (!th) return;

  e.preventDefault(); const startX = e.clientX, startW = r.width;
  const mv = ev => { th.style.width = Math.max(72, startW + ev.clientX - startX) + 'px'; };
  const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); scheduleSave(); };
  addEventListener('pointermove', mv); addEventListener('pointerup', up);
}

/* W8: Detailed Remarks */
function ensureRemarks(root) {
  $$('table.journal', root).forEach(t => {
    const head = t.tHead && t.tHead.rows[0]; if (!head) return;
    let idx = [...head.cells].findIndex(c => /detailed remarks/i.test(c.textContent));
    if (idx < 0) { const th = document.createElement('th'); th.textContent = 'Detailed Remarks'; head.appendChild(th); idx = head.cells.length - 1; }
    [...t.tBodies].forEach(b => [...b.rows].forEach(r => {
      while (r.cells.length <= idx) r.insertCell(-1);
      const c = r.cells[idx];
      if (!c.classList.contains('rm')) { const txt = c.textContent.trim(); c.className = 'rm'; c.contentEditable = 'false'; c.innerHTML = rmInner(txt); }
    }));
  });
}
function openRemarks(btn) {
  const td = btn.closest('td'), tr = td.closest('tr'), container = btn.closest('.doc-body');
  const m = S.moms.find(x => x.id === (S.route.view === 'editor' ? S.route.id : container.dataset.mom)); if (!m) return;
  const c = [...tr.cells].map(x => x.textContent.trim());
  const textEl = $('.rm-text', td);
  const scrim = document.createElement('div'); scrim.className = 'drawer-scrim';
  scrim.innerHTML = `<aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="rmT">
    <header class="drawer-head"><div><p class="eyebrow">Detailed Remarks</p><h2 id="rmT">${esc(c[0] || 'New prospect')}</h2><p class="drawer-meta">${[c[1], c[2], c[3] && 'Next: ' + c[3]].filter(Boolean).map(esc).join(' · ')}</p></div>
      <button class="icon-btn" data-close aria-label="Close">${icon('i-x')}</button></header>
    <div class="drawer-body"><label class="sr-only" for="rmText">Detailed remarks for ${esc(c[0])}</label><textarea id="rmText" class="rm-area" placeholder="Write as much as you need — it saves as you type.">${esc(textEl.textContent)}</textarea></div>
    <footer class="drawer-foot"><span class="save-status" data-state="saved" role="status">${icon('i-check')}<span>Saved</span></span><span class="hint mono desk-only">Esc to close</span></footer></aside>`;
  let t = null;
  const st = $('.save-status', scrim), ta = $('#rmText', scrim);
  const flush = () => {
    clearTimeout(t); if (!textEl.isConnected) return;
    textEl.textContent = ta.value; $('.rm-cta', td).textContent = ta.value ? 'Read in full · edit' : 'Add remarks';
    if (S.route.view === 'editor') commit(); else m.body = container.innerHTML;
    st.dataset.state = 'saved'; st.innerHTML = `${icon('i-check')}<span>Saved</span>`;
  };
  ta.addEventListener('input', () => { st.dataset.state = 'saving'; st.innerHTML = '<span class="dot"></span><span>Saving…</span>'; clearTimeout(t); t = setTimeout(flush, 700); });
  scrim.addEventListener('mousedown', e => { if (e.target === scrim) closeOverlay(scrim); });
  pushOverlay(scrim, flush);
  setTimeout(() => { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 40);
}
function positionToolbar() {
  const bar = $('#edToolbar'); if (!bar || !window.visualViewport) return;
  if (innerWidth >= 768) { bar.style.transform = ''; return; }
  const vv = visualViewport; const off = Math.max(0, innerHeight - vv.height - vv.offsetTop);
  bar.style.transform = off ? `translateY(${-off}px)` : '';
}

/* ---------- Render ---------- */
const main = $('#main');
let focusAfter = null;
function render() {
  if (S.editing) { clearTimeout(saveT); commit(); S.editing = null; }
  $$('.menu-scrim').forEach(el => closeOverlay(el));
  const r = parseRoute(); S.route = r;
  const scroll = {}; $$('.col', main).forEach(c => { scroll[c.dataset.area] = $('.col-body', c).scrollTop; });
  document.body.classList.toggle('is-editor', r.view === 'editor');
  main.innerHTML = r.view === 'editor' ? viewEditor(r.id) : r.view === 'browse' ? viewBrowse(r) : viewPage(r.view);
  $$('.col', main).forEach(c => { if (scroll[c.dataset.area] != null) $('.col-body', c).scrollTop = scroll[c.dataset.area]; });
  if (r.view === 'browse') {
    S.lastBrowse = location.hash || '#/browse';
    const sel = $('.col.is-last .row.is-selected', main) || $('.row.is-selected', main); if (sel) sel.scrollIntoView({ block: 'nearest' });
    const cols = $('.cols', main); if (cols) cols.scrollLeft = cols.scrollWidth;
    if (ensureRemarksIn()) { /* journal in read pane */ }
  }
  if (r.view === 'editor') mountEditor();
  const railKey = r.view === 'editor' ? 'browse' : r.view;
  $$('[data-rail]').forEach(b => b.classList.toggle('is-active', b.dataset.rail === railKey));
  $$('[data-tab]').forEach(b => b.classList.toggle('is-active', b.dataset.tab === railKey));
  $$('[data-rail="browse"],[data-tab="browse"]').forEach(b => b.setAttribute('href', r.view === 'browse' ? '#/browse' : S.lastBrowse));
  if (focusAfter === 'last-first') { const f = $('.col.is-last .row', main); f && f.focus(); }
  focusAfter = null;
  if (S.flash) setTimeout(() => { S.flash = null; }, 50);
}
function ensureRemarksIn() { const b = $('.pane .doc-body', main); if (b) ensureRemarks(b); return !!b; }

/* ---------- Click delegation ---------- */
document.addEventListener('mousedown', e => { if (e.target.closest('.ed-toolbar .tb, .tbl-tools .tb')) e.preventDefault(); });
document.addEventListener('click', e => {
  const closer = e.target.closest('[data-close]'); if (closer) { const ov = closer.closest('.ov'); if (ov) { closeOverlay(ov); return; } }
  const cmdBtn = e.target.closest('[data-cmd]'); if (cmdBtn) { runCmd(cmdBtn.dataset.cmd, cmdBtn); return; }
  const tcmd = e.target.closest('[data-tcmd]'); if (tcmd) { tableOp(tcmd.dataset.tcmd); return; }
  const roleBtn = e.target.closest('[data-role-set]'); if (roleBtn) { setRole(roleBtn.dataset.roleSet); return; }
  const b = e.target.closest('[data-action]'); if (!b) return;
  const act = b.dataset.action, aid = b.dataset.area, id = b.dataset.id, it = id ? findItem(id) : null;
  const curArea = () => { const p = S.route.path || []; return aid ? area(aid) : p.length ? area(p[p.length - 1]) : area('verdant'); };
  switch (act) {
    case 'palette': openPalette(); break;
    case 'jump': openJump(); break;
    case 'new-sheet': openNewSheet(b); break;
    case 'new-mom': newMom(aid, b.dataset.grp || null); break;
    case 'new-area': S.role === 'admin' ? openArea({ parent: null }) : adminOnly('create areas'); break;
    case 'create-menu': openMenu(b, createItems(area(aid)), `Add to ${area(aid).name}`); break;
    case 'create-menu-files': openMenu(b, createItems(area(aid), 'file'), `Add a file to ${area(aid).name}`); break;
    case 'upload': openUpload({ areaId: aid, grp: b.dataset.grp || null }); break;
    case 'link-new': openLink({ areaId: aid }); break;
    case 'edit': S.returnHash = location.hash; location.hash = '#/mom/' + id; break;
    case 'done': done(); break;
    case 'open-file': openFile(it); break;
    case 'download': toast(`Downloading “${it.name}”…`, { ic: 'i-download' }); break;
    case 'copy': { const url = it.url || `https://atlas.example/f/${it.id}`; try { navigator.clipboard && navigator.clipboard.writeText(url); } catch (err) { /* ignore */ } toast('Address copied', { ic: 'i-copy' }); break; }
    case 'flag':
      it.flagged = !it.flagged;
      if (S.route.view === 'editor') { b.setAttribute('aria-pressed', it.flagged); b.innerHTML = icon(it.flagged ? 'i-flag-fill' : 'i-flag'); } else render();
      toast(it.flagged ? 'Flagged as important' : 'Flag removed', { ic: it.flagged ? 'i-flag-fill' : 'i-flag' }); break;
    case 'move': openMove(it); break;
    case 'item-more': {
      const mom = isMom(it), items = [];
      if (!mom) items.push({ ic: 'i-external', label: 'Open', run: () => openFile(it) });
      items.push({ ic: 'i-pen', label: 'Rename', run: () => openRename(it) }, { ic: 'i-move', label: 'Move…', run: () => openMove(it) },
        { ic: it.flagged ? 'i-flag-fill' : 'i-flag', label: it.flagged ? 'Unflag' : 'Flag as important', run: () => { it.flagged = !it.flagged; render(); toast(it.flagged ? 'Flagged as important' : 'Flag removed'); } });
      if (mom) items.push({ ic: 'i-pdf', label: 'Export as PDF (A4)', run: () => { if (S.editing) saveNow(false); toast(`Exported “${it.title}.pdf”`, { ic: 'i-download' }); } });
      else items.push({ ic: 'i-copy', label: 'Copy address', run: () => toast('Address copied', { ic: 'i-copy' }) });
      if (S.role === 'admin') items.push('-', { ic: 'i-share', label: it.shared ? 'Turn off share link' : 'Create share link', run: () => { it.shared = !it.shared; toast(it.shared ? 'Share link created and copied' : 'Share link turned off — it stops working now', { ic: 'i-share' }); } },
        { ic: 'i-lock', label: it.ro ? 'Allow members to edit' : 'Mark read-only', run: () => { it.ro = !it.ro; toast(it.ro ? 'Marked read-only for members' : 'Members can edit again'); } },
        '-', { ic: 'i-trash', label: 'Delete…', danger: true, run: () => confirmDelete(it) });
      openMenu(b, items, itemName(it)); break;
    }
    case 'area-more': {
      const a = area(aid), items = [{ ic: 'i-pen', label: 'Rename or change emoji', run: () => openRename(a, true) }, { ic: 'i-layers', label: 'New grouping', run: () => openGrouping(a.id) }];
      if (S.role === 'admin') items.push({ ic: 'i-columns', label: 'New sub-area', run: () => openArea({ parent: a.id }) }, '-', { ic: 'i-trash', label: 'Delete area…', danger: true, run: () => confirmDeleteArea(a) });
      openMenu(b, items, a.name); break;
    }
    case 'relock': S.unlocked.delete(aid); render(); toast(`${area(aid).name} is locked again`, { ic: 'i-lock' }); break;
    case 'restore': restore(id); break;
    case 'purge': {
      if (S.role !== 'admin') return adminOnly('remove items permanently');
      const d = S.deleted.find(x => x.id === id);
      const dlg = openDialog({ title: `Remove “${esc(d.name)}” for good?`, body: `<p class="dlg-text">This can’t be undone.</p>`, actions: `<button class="btn" data-close>Cancel</button><button class="btn btn-danger" data-role="x">Remove permanently</button>` });
      $('[data-role=x]', dlg).addEventListener('click', () => { S.deleted = S.deleted.filter(x => x !== d); closeDlg(dlg); render(); toast('Removed permanently', { ic: 'i-trash' }); });
      break;
    }
    case 'empty-trash': {
      const dlg = openDialog({ title: 'Empty Deleted?', body: `<p class="dlg-text">All ${plural(S.deleted.length, 'item')} will be removed for good. This can’t be undone.</p>`, actions: `<button class="btn" data-close>Cancel</button><button class="btn btn-danger" data-role="x">Empty all</button>` });
      $('[data-role=x]', dlg).addEventListener('click', () => { S.deleted = []; closeDlg(dlg); render(); toast('Deleted is empty', { ic: 'i-trash' }); });
      break;
    }
    case 'remarks': e.preventDefault(); openRemarks(b); break;
    case 'open-doc': e.preventDefault(); toast(`Opened “${it.doc.label}” in a new tab`, { ic: 'i-external' }); break;
    case 'doc-attach': {
      const m = S.editing;
      const dlg = openDialog({ title: 'Attach a document link', body: `<p class="dlg-text">Keep the meeting’s companion document (e.g. a Google Doc) one click away.</p><div class="field"><label for="dcName">Name</label><input id="dcName" class="input" placeholder="e.g. Steering pack – October"></div><div class="field"><label for="dcUrl">Address</label><input id="dcUrl" class="input" placeholder="https://docs.google.com/…"></div>`, actions: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-role="ok">Attach</button>` });
      const ok = () => { const u = $('#dcUrl', dlg); if (!u.value.trim()) { fieldError(u, 'Paste the document’s address.'); return u.focus(); } m.doc = { label: $('#dcName', dlg).value.trim() || u.value.trim(), url: u.value.trim() }; closeDlg(dlg); render(); toast('Document linked', { ic: 'i-link' }); };
      $('[data-role=ok]', dlg).addEventListener('click', ok); dlg.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.tagName === 'INPUT') { ev.preventDefault(); ok(); } });
      break;
    }
    case 'doc-remove': S.editing.doc = null; render(); toast('Document link removed'); break;
    case 'tag-remove': { const m = S.editing; m.tags = m.tags.filter(t => t !== b.dataset.tag); $('#docTags').innerHTML = tagsHTML(m); bindTagInput(m); scheduleSave(); break; }
    case 'account': {
      const html = `<div class="acct"><span class="avatar lg">GK</span><div><b>Greg Kurnia</b><span>greg@example.com</span><span class="role-chip">${S.role}</span></div></div><hr>
        <button class="menu-item" data-go="#/deleted">${icon('i-trash')}<span>Deleted items</span></button>
        <button class="menu-item" data-go="pw">${icon('i-lock')}<span>Change password</span></button>
        <button class="menu-item" data-go="out">${icon('i-signout')}<span>Sign out</span></button>`;
      const p = popover(b, html, { label: 'Account' });
      p.pop.addEventListener('click', ev => { const g = ev.target.closest('[data-go]'); if (!g) return; p.close(); const v = g.dataset.go; if (v === 'out') toast('Signed out (prototype)', { ic: 'i-signout' }); else if (v === 'pw') toast('Password change is part of the full prototype', { ic: 'i-lock' }); else go(v); });
      break;
    }
    case 'fail-demo': { const a = curArea(); openUpload({ areaId: a && !isLocked(a) ? a.id : 'verdant', file: { name: 'Annual report 2025.pdf', size: 14.2 * 1048576 } }); break; }
  }
});

/* Unlock form (P2) */
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form="unlock"]'); if (!f) return; e.preventDefault();
  const a = area(f.dataset.area), input = $('input', f), err = $('.err', f);
  if (input.value === 'meridian') { S.unlocked.add(a.id); render(); toast(`${a.name} is open for this session`, { ic: 'i-unlock' }); }
  else { err.hidden = false; err.innerHTML = `${icon('i-alert')}${input.value ? 'That password isn’t right. Try again.' : 'Enter the password first.'}`; input.select(); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); }
});

/* ---------- Keyboard ---------- */
const typing = t => t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  if (mod && k === 'k') { e.preventDefault(); openPalette(); return; }
  if (mod && k === 's') { e.preventDefault(); if (S.route.view === 'editor') saveNow(true); else toast('Everything is saved'); return; }
  if (e.key === 'Escape') {
    if (stack.length) { e.preventDefault(); closeTop(); return; }
    if (S.route.view === 'editor') { e.preventDefault(); done(); return; }
    if (S.route.view === 'browse' && S.route.item) { go(hashFor(S.route.path)); return; }
    return;
  }
  if (e.key === 'Tab' && stack.length) {
    const top = stack[stack.length - 1].el, f = focusables(top); if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    return;
  }
  if (stack.length || typing(e.target)) return;
  if (k === 'n' && !mod && S.route.view === 'browse' && S.route.path.length) { const a = area(S.route.path[S.route.path.length - 1]); if (!isLocked(a)) { e.preventDefault(); newMom(a.id); } return; }
  const row = e.target.closest && e.target.closest('.col .row');
  if (row && ['ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
    e.preventDefault();
    const col = row.closest('.col'), rows = $$('.row', col), i = rows.indexOf(row);
    if (e.key === 'ArrowDown' && rows[i + 1]) rows[i + 1].focus();
    if (e.key === 'ArrowUp' && rows[i - 1]) rows[i - 1].focus();
    if (e.key === 'ArrowRight') { focusAfter = row.dataset.dropArea ? 'last-first' : null; go(row.getAttribute('href')); }
    if (e.key === 'ArrowLeft') { const prev = col.previousElementSibling; const t = prev && ($('.row.is-path, .row.is-selected', prev) || $('.row', prev)); if (t) t.focus(); }
  }
});

/* ---------- Drag and drop (O5 move, C6 upload) ---------- */
let dragId = null;
const clearDrop = (keep) => $$('.is-drop').forEach(x => { if (x !== keep) x.classList.remove('is-drop'); });
function validDrop(t) {
  const it = findItem(dragId); if (!it) return false;
  const a = area(t.dataset.dropArea); if (!a || isLocked(a)) return false;
  const g = t.dataset.dropGrp || null;
  if (g && t.dataset.grpKind !== (isMom(it) ? 'mom' : 'file')) return false;
  return !(it.area === a.id && (it.grouping || null) === g);
}
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
document.addEventListener('dragstart', e => { const r = e.target.closest && e.target.closest('[data-drag]'); if (!r) return; dragId = r.dataset.drag; e.dataTransfer.setData('text/plain', itemName(findItem(dragId))); e.dataTransfer.effectAllowed = 'move'; });
document.addEventListener('dragend', () => { dragId = null; clearDrop(); });
document.addEventListener('dragover', e => {
  if (dragId) {
    let t = e.target.closest && e.target.closest('[data-drop-area]');
    if (t && !validDrop(t)) { const outer = t.parentElement && t.parentElement.closest('[data-drop-area]'); t = outer && validDrop(outer) ? outer : null; }
    clearDrop(t); if (t) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; t.classList.add('is-drop'); }
    return;
  }
  if (hasFiles(e)) {
    e.preventDefault();
    const br = $('#browser'), p = S.route.path || [];
    const ok = br && e.target.closest && e.target.closest('#browser') && p.length && !isLocked(area(p[p.length - 1])) && !stack.length;
    if (br) br.classList.toggle('is-filedrop', !!ok);
    e.dataTransfer.dropEffect = ok ? 'copy' : 'none';
  }
});
document.addEventListener('dragleave', e => { if (!e.relatedTarget) { clearDrop(); const br = $('#browser'); if (br) br.classList.remove('is-filedrop'); } });
document.addEventListener('drop', e => {
  if (dragId) {
    e.preventDefault(); const t = $('.is-drop');
    if (t) moveItem(findItem(dragId), t.dataset.dropArea, t.dataset.dropGrp || null);
    clearDrop(); dragId = null; return;
  }
  if (hasFiles(e)) {
    e.preventDefault(); const br = $('#browser'); if (br) br.classList.remove('is-filedrop');
    const p = S.route.path || [];
    if (br && e.target.closest('#browser') && p.length && !stack.length && e.dataTransfer.files[0]) {
      const g = e.target.closest('.grp[data-grp-kind="file"]');
      openUpload({ areaId: p[p.length - 1], grp: g ? g.dataset.dropGrp : null, file: e.dataTransfer.files[0] });
    }
  }
});

/* ---------- Phone: swipe back ---------- */
let sx = null, sy = null;
main.addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX < 28 ? t.clientX : null; sy = t.clientY; }, { passive: true });
main.addEventListener('touchend', e => {
  if (sx == null) return; const t = e.changedTouches[0];
  if (t.clientX - sx > 80 && Math.abs(t.clientY - sy) < 60) { const back = $('.m-back', main); if (back) go(back.getAttribute('href')); else if (S.route.view === 'editor') done(); }
  sx = null;
});

/* ---------- Prototype controls ---------- */
function setRole(r) {
  S.role = r; $$('[data-role-set]').forEach(b => b.setAttribute('aria-checked', b.dataset.roleSet === r));
  render(); toast(r === 'member' ? 'Viewing as a member — sees Clients and Sales pipeline only' : 'Viewing as admin', { ic: 'i-columns' });
}
$('#protoToggle').addEventListener('click', () => { const p = $('#protoPanel'), open = p.hidden; p.hidden = !open; $('#protoToggle').setAttribute('aria-expanded', open); });
$('#pEmpty').addEventListener('change', e => { S.emptyDemo = e.target.checked; render(); });
$('#pOffline').addEventListener('change', e => { S.offline = e.target.checked; render(); toast(S.offline ? 'Connection lost — you’re offline' : 'Back online — up to date', { ic: S.offline ? 'i-wifi-off' : 'i-check' }); });

/* ---------- Boot ---------- */
$('#fileInput').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f && pendingPick) pendingPick(f); });
document.addEventListener('selectionchange', () => { if (S.route.view === 'editor') updateToolbar(); });
if (window.visualViewport) { visualViewport.addEventListener('resize', positionToolbar); visualViewport.addEventListener('scroll', positionToolbar); }
let lastW = innerWidth, rT = null;
addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if (Math.abs(innerWidth - lastW) > 40 && S.route.view !== 'editor') { lastW = innerWidth; render(); } }, 150); });
addEventListener('hashchange', render);
if (!location.hash) history.replaceState(null, '', '#/browse');
render();
})();
