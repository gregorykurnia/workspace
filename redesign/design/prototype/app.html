<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F8FC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1120" media="(prefers-color-scheme: dark)">
<meta name="description" content="Daybook prototype: minutes, files and areas for a team.">
<title>Daybook — prototype</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;650;750;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/views.css">
<link rel="stylesheet" href="styles/editor.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>

<div class="shell" id="shell">
  <aside class="side" id="side" aria-label="Workspace"></aside>
  <div class="col">
    <header class="topbar" id="topbar"></header>
    <div class="banners" id="banners" aria-live="polite"></div>
    <main id="view" tabindex="-1"></main>
  </div>
</div>

<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div id="layers"></div>

<div class="dropzone-overlay" id="dropOverlay" aria-hidden="true">
  <div>
    <span class="art"><svg class="i xl" aria-hidden="true"><use href="#i-upload"/></svg></span>
    <h2 id="dropTitle">Drop to add</h2>
    <p>Images, PDFs, videos — anything. You can rename it and add a note next.</p>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<aside class="proto" id="proto" aria-label="Prototype controls"></aside>
<input type="file" id="fileInput" multiple hidden>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/shell.js"></script>
<script src="js/home.js"></script>
<script src="js/area.js"></script>
<script src="js/mom.js"></script>
<script src="js/files.js"></script>
<script src="js/access.js"></script>
<script src="js/account.js"></script>
<script src="js/app.js"></script>
</body>
</html>
